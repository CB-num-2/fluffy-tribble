<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Quinceañera</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .slide { display: none; width: 100vw; height: 100vh; justify-content: center; align-items: center; }
        .slide.active { display: flex; }
        img { max-width: 100%; max-height: 100%; object-fit: contain; }
    </style>
</head>
<body>

    <!-- Slide 1: Title Image -->
    <div class="slide active">
        <img src="QCTITLE.png" alt="Title">
    </div>

    <!-- Slide 2: Invitation Image -->
    <div class="slide">
        <img src="QCMAIN.png" alt="Invitation">
    </div>

    <!-- Slide 3: Plan Image -->
    <div class="slide">
        <img src="QCPLAN.png" alt="Plan for the day">
    </div>

    <script>
        let idx = 0;
        const slides = document.querySelectorAll('.slide');

        function changeSlide(step) {
            slides[idx].classList.remove('active');
            idx = (idx + step + slides.length) % slides.length;
            slides[idx].classList.add('active');
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown') {
                e.preventDefault();
                changeSlide(1);
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') {
                e.preventDefault();
                changeSlide(-1);
            }
        });
    </script>
</body>
</html>
